---
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  PSRULE_DIRECTORY: ./
  INFRA_WORKING_DIRECTORY: ./
  BICEP_ORCHESTRATION: ./src/orchestration/main.bicep

concurrency:
  group: "release"
  cancel-in-progress: true

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest

    permissions:
      contents: read # Required to read the repository's contents
      packages: read # Required to read the repository's packages
      statuses: write # Required to update the commit status

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GH Super Linter
        uses: super-linter/super-linter@v6
        env:
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_POWERSHELL: true
          VALIDATE_YAML: true

  ps-rule:
    runs-on: ubuntu-latest
    name: PSRule
    permissions:
      contents: read
    steps:
      - name: Check-Out Repository
        uses: actions/checkout@v4

      - name: Run PSRule Validation
        uses: Microsoft/ps-rule@v2.9.0
        with:
          option: "ps-rule.yaml"
          inputType: inputPath
          inputPath: ${{ env.BICEP_ORCHESTRATION }}
          path: ${{ env.PSRULE_DIRECTORY }}
          modules: PSRule.Rules.Azure
          outcome: All
          baseline: Azure.Default
          outputFormat: NUnit3
          outputPath: reports/ps-rule-results.xml

  build-infrastructure:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - linting
      - ps-rule
    steps:
      - name: Check-Out Repository
        uses: actions/checkout@v4

      - name: Bicep Build
        uses: Azure/cli@v1.0.7
        with:
          inlineScript: |
            export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
            az bicep build -f ${{ env.BICEP_ORCHESTRATION }} --stdout

      - name: Copy Files for artefact Upload
        run: rsync -av --exclude='build' --exclude={'.vscode/','.ps-rule/','.ps-docs/','*.md'} ./. ./build
        working-directory: ${{ env.INFRA_WORKING_DIRECTORY }}

      - name: Upload artefact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure
          path: ${{ env.INFRA_WORKING_DIRECTORY }}/build

  # If you need additional environments, make a copy of the code block below and update at least the environmentName for each environment.
  deploy_Sbx:
    name: Sandbox
    uses: ./.github/workflows/deploy.yml
    concurrency: "deploy"
    needs:
      - build-infrastructure
    with:
      artefactName: infrastructure
      environmentName: sbx
      location: ${{ vars.LOCATION }}
      moduleName: "ModuleName"
    secrets: inherit
