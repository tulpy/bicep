---
name: Deploy

on:
  workflow_call:
    inputs:
      subscriptionId:
        required: true
        type: string
      environmentIdentifier:
        required: true
        type: string
      location:
        required: true
        type: string
      applicationRegistrationName:
        required: true
        type: string
      gitHubRepoName:
        required: true
        type: string
      gitHubOrganisation:
        required: true
        type: string
      workloadShortName:
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true

permissions:
  contents: read # Required to read the repository's contents
  id-token: write # This is required for azure/login

env:
  deploymentJobId: "deploy-rg-${{ github.run_id }}"

jobs:
  deploy:
    name: deploy
    environment: ${{ inputs.environmentIdentifier }}
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Az Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      - name: Install Azure Cost CLI
        run: dotnet tool install -g azure-cost-cli
  
      - name: Run Azure Cost CLI
        run: azure-cost accumulatedCost -o markdown --subscription '8d0248a2-d875-4407-99a6-0981fe09bff2' >> $GITHUB_STEP_SUMMARY
  
      - name: Create Application Registration and Federated Identity - ${{ inputs.environmentIdentifier }}
        uses: azure/powershell@v2
        with:
          inlineScript: |
            Write-Information "==> Running script..." -InformationAction Continue
            ./.github/scripts/Create-AppRegistrationOIDC.ps1 -workloadShortName ${{inputs.workloadShortName}} -applicationRegistrationName ${{inputs.applicationRegistrationName}} -gitHubOrganisation ${{inputs.gitHubOrganisation}} -gitHubRepoName ${{inputs.gitHubRepoName}}
          azPSVersion: 'latest'

      - name: whatIf
        uses: azure/bicep-deploy@v2
        with:
          operation: whatIf
          type: deployment
          name: main-${{env.deploymentJobId}}
          location: ${{inputs.location}}
          scope: subscription
          subscription-id: ${{ inputs.subscriptionId }}
          parameters-file: ./deployment/parameters.bicepparam

      - name: Deploy
        uses: azure/bicep-deploy@v2
        with:
          operation: create
          type: deployment
          name: main-${{env.deploymentJobId}}
          location: ${{inputs.location}}
          scope: subscription
          subscription-id: ${{ inputs.subscriptionId }}
          parameters-file: ./deployment/parameters.bicepparam

      # Log out of Azure
      - name: Az Logout
        run: az logout
