---
name: Deploy

on:
  workflow_call:
    inputs:
      subscriptionId:
        required: true
        type: string
      environmentIdentifier:
        required: true
        type: string
      location:
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read # Required to read the repository's contents
  id-token: write # This is required for azure/login

env:
  deploymentJobId: "deploy-rg-${{ github.run_id }}"

jobs:
  deploy:
    name: deploy
    environment: ${{ inputs.environmentIdentifier }}
    runs-on: windows-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Az Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      - name: Set PAL
        uses: Azure/cli@v2
        with:
          inlineScript: |
            az extension add --name managementpartner
            az managementpartner update --partner-id 1158331 || az managementpartner create --partner-id 1158331

      # Preview Changes
      - name: Validate
        uses: azure/bicep-deploy@v2
        with:
          operation: validate
          type: deployment
          name: main-${{env.deploymentJobId}}
          location: ${{inputs.location}}
          scope: subscription
          subscription-id: ${{ inputs.subscriptionId }}
          parameters-file: ./deployment/parameters.bicepparam

      - name: Deploy
        uses: azure/bicep-deploy@v2
        with:
          operation: create
          type: deployment
          name: main-${{env.deploymentJobId}}
          location: ${{inputs.location}}
          scope: subscription
          subscription-id: ${{ inputs.subscriptionId }}
          parameters-file: ./deployment/parameters.bicepparam

      # Log out of Azure
      - name: Az Logout
        run: az logout
